[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphersentry"
version = "0.1.0"
description = "An explainable behavioural ransomware detection research prototype"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["PySide6==6.8.3", "watchdog==6.0.0", "psutil==7.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
build = ["pyinstaller==6.12.0"]

[project.scripts]
ciphersentry = "ciphersentry.__main__:main"

[tool.setuptools.packages.find]
include = ["ciphersentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
