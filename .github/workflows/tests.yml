name: Desktop prototype tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Check Qt runtime imports
        run: python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtTest import QTest; print('Qt runtime imports OK')"
      - run: python -m pytest -q -ra --tb=short --junitxml=test-results.xml
      - name: Summarize test results
        if: always()
        run: python -m scripts.ci_test_summary test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
